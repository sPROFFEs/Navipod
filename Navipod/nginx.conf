events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # Service Worker — must be served from root scope with no-cache
        # and the Service-Worker-Allowed header to control the full app.
        location = /sw.js {
            alias /app/assets/sw.js;
            default_type application/javascript;
            add_header Service-Worker-Allowed "/";
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Web App Manifest — must have the correct MIME type for Chrome
        # to accept it as a PWA manifest.
        location = /assets/site.webmanifest {
            alias /app/assets/site.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
            expires 0;
        }

        # Servir assets directamente desde el disco
        location /assets/ {
            alias /app/assets/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location /updater/ {
            proxy_pass http://updater:8090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/stream/ {
            proxy_pass http://concierge:8000;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The auth browser is reachable only through an authenticated,
        # short-lived Concierge session. VNC itself stays bound to localhost
        # inside the downloader container and no host port is published.
        location = /_internal/auth-browser-authorize {
            internal;
            proxy_pass http://concierge:8000/admin/api/downloader/auth-browser/authorize;
            # Compatibility during a rolling self-update: a pre-cookie
            # Concierge process still emits credentials in the noVNC URL.
            # Current Concierge ignores these headers and authorizes via the
            # scoped HttpOnly cookie below.
            proxy_set_header X-Auth-Browser-Session $auth_browser_session;
            proxy_set_header X-Auth-Browser-Token $auth_browser_token;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /admin/auth-browser/ {
            # auth_request is a subrequest and does not retain the parent
            # request's query arguments. Capture legacy credentials first so
            # they survive only for the authorization handoff.
            set $auth_browser_session $arg_session_id;
            set $auth_browser_token $arg_token;
            auth_request /_internal/auth-browser-authorize;
            proxy_pass http://downloader:6080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # This route is intentionally framed only by Navipod's own admin UI.
            # Declaring headers here replaces inherited add_header directives,
            # so retain the server-level protections explicitly.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
        }

        # Proxy para el backend de FastAPI
        location / {
            proxy_pass http://concierge:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
